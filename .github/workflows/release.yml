name: Build et Release Multiplateforme

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            sep: ';'
            target: 'x86_64-pc-windows-msvc'
            extension: '.exe'
          - platform: 'macos-latest'
            sep: ':'
            target: 'aarch64-apple-darwin'
            extension: ''
          - platform: 'ubuntu-22.04'
            sep: ':'
            target: 'x86_64-unknown-linux-gnu'
            extension: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système Linux (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Installation dépendances Frontend
        run: |
          cd frontend
          npm install

      - name: Compilation Frontend React
        run: |
          cd frontend
          npm run build

      - name: Installation dépendances Python et PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            if (fs.existsSync('backend/requirements.txt')) {
              execSync('pip install -r backend/requirements.txt', { stdio: 'inherit' });
            } else if (fs.existsSync('requirements.txt')) {
              execSync('pip install -r requirements.txt', { stdio: 'inherit' });
            }
          "

      - name: Compilation Backend avec PyInstaller
        run: |
          cd backend
          pyinstaller --onefile --add-data "../frontend/dist${{ matrix.sep }}frontend_dist" --name idenva-backend app/main.py

      - name: Placement du binaire sidecar pour Tauri
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const targetDir = path.join('frontend', 'src-tauri', 'binaries');
            if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
            const ext = '${{ matrix.extension }}';
            const src = path.join('backend', 'dist', 'idenva-backend' + ext);
            const dest = path.join(targetDir, 'idenva-backend-${{ matrix.target }}' + ext);
            fs.copyFileSync(src, dest);
          "

      - name: Build de l'application Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: v__VERSION__
          releaseName: 'Idenva v__VERSION__'
          releaseBody: 'Téléchargez l’installeur correspondant à votre système.'
          releaseDraft: true
          prerelease: false