name: Build et Release Multiplateforme

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            sep: ';'
            target: 'x86_64-pc-windows-msvc'
            extension: '.exe'
          - platform: 'macos-latest'
            sep: ':'
            target: 'aarch64-apple-darwin'
            extension: ''
          - platform: 'ubuntu-22.04'
            sep: ':'
            target: 'x86_64-unknown-linux-gnu'
            extension: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système Linux (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Installation dépendances Frontend
        run: |
          cd frontend
          npm install

      - name: Compilation Frontend React
        run: |
          cd frontend
          npm run build

      - name: Compilation Backend avec PyInstaller
        run: |
          pip install -r backend/requirements.txt pyinstaller
          cd backend
          pyinstaller --onefile --add-data "../frontend/dist${{ matrix.sep }}frontend_dist" --name idenva-backend app/main.py

      - name: Placement du binaire sidecar pour Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/idenva-backend${{ matrix.extension }} frontend/src-tauri/binaries/idenva-backend-${{ matrix.target }}${{ matrix.extension }}

      - name: Build de l'application Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: v__VERSION__
          releaseName: 'Idenva v__VERSION__'
          releaseBody: 'Téléchargez l’installeur correspondant à votre système.'
          releaseDraft: true
          prerelease: false